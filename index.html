<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ed">
<title>여행 다트</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7f5ed;
    --ink: #183e34;
    --muted: #4f6259;
    --red: #ad412b;
    --line: #cbd2c4;
    --surface: #fffdf5;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    font-synthesis: none;
    color: var(--ink);
    background: var(--paper);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }
  a { color: inherit; text-underline-offset: 0.22em; }

  .page { max-width: 1240px; margin: auto; padding: 0 42px; }
  .masthead {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 24px 0 20px;
    border-bottom: 1px solid var(--line);
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.035em;
  }
  .target-icon {
    display: inline-block;
    width: 24px;
    height: 24px;
    position: relative;
    border: 1.5px solid currentColor;
    border-radius: 50%;
    flex: none;
  }
  .target-icon::before, .target-icon::after {
    position: absolute;
    content: "";
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }
  .target-icon::before { width: 12px; height: 12px; border: 1.5px solid currentColor; }
  .target-icon::after { width: 4px; height: 4px; background: currentColor; }
  .masthead .target-icon { color: var(--red); }

  .game {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(28px, 5vw, 76px);
    row-gap: 30px;
    margin-top: 30px;
  }
  .map-frame {
    position: relative;
    margin: 0;
    overflow: hidden;
    isolation: isolate;
    border: 1px solid #afc1b7;
    border-radius: 12px;
    background-color: #e5ebe2;
    background-image:
      linear-gradient(to right, #778c8020 1px, transparent 1px),
      linear-gradient(to bottom, #778c8020 1px, transparent 1px);
    background-size: 28px 28px;
    box-shadow: 0 2px 0 #1a3d3012;
  }
  #map { display: block; width: 100%; height: auto; }
  .map-caption {
    position: absolute;
    z-index: 1;
    top: 17px;
    left: 19px;
    pointer-events: none;
    color: #34584c;
    font-weight: 800;
    font-size: 0.875rem;
    letter-spacing: 0.05em;
  }
  .compass {
    position: absolute;
    z-index: 1;
    right: 21px;
    bottom: 18px;
    width: 30px;
    text-align: center;
    color: #34584c;
    font: 700 0.75rem/1.2 system-ui, sans-serif;
    pointer-events: none;
  }
  .compass::after {
    content: "";
    display: block;
    width: 17px;
    height: 30px;
    margin: 3px auto 0;
    background: linear-gradient(90deg, #34584c 50%, #748e81 50%);
    clip-path: polygon(50% 0%, 100% 100%, 50% 76%, 0% 100%);
  }
  .region { stroke: #668e7a; stroke-width: .7; vector-effect: non-scaling-stroke; }
  .region.is-unavailable { fill: #dce5d7; stroke: #91a397; }
  .region.is-excluded { fill: #dbe1d6; stroke: #98a69a; }
  #hit-region { fill: #edb090; stroke: #9a3b27; stroke-width: 1.65; vector-effect: non-scaling-stroke; }
  #impact { transform-box: fill-box; transform-origin: center; }
  .water-label { fill: #4b6c61; font-size: 13px; letter-spacing: 3px; }
  .water-label text { text-anchor: middle; }

  .controls { min-width: 0; padding: 10px 0; }
  h1 { margin: 0; font-size: clamp(2.55rem, 4.9vw, 4.45rem); letter-spacing: -0.085em; line-height: 1.08; }
  h1.is-result { font-size: clamp(2.4rem, 4.2vw, 3.8rem); overflow-wrap: anywhere; }
  .province { margin: 0 0 8px; font-size: 1.125rem; font-weight: 800; color: var(--red); }
  .description { margin: 17px 0 0; font-size: 1.05rem; line-height: 1.55; color: var(--muted); }
  .draw-area { display: grid; gap: 10px; margin-top: 27px; max-width: 385px; }
  .draw {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 62px;
    width: 100%;
    padding: 12px 20px;
    border: 1px solid #15392e;
    border-radius: 9px;
    background: #205443;
    color: white;
    box-shadow: 0 3px 0 #15392e;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.025em;
  }
  .draw:hover:not(:disabled) { background: #174737; }
  .draw:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #15392e; }
  .draw:disabled { background: #526d60; border-color: #526d60; box-shadow: 0 3px 0 #405a4f; }
  .draw .target-icon { width: 21px; height: 21px; }
  .skip {
    min-height: 45px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    background: transparent;
    font-weight: 700;
  }
  .skip:hover { background: #edf0e7; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    justify-content: space-between;
    max-width: 385px;
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .count { margin: 0; color: var(--muted); font-size: .875rem; }
  .filter-button, .quiet-button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    min-height: 43px;
    padding: 7px 11px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid #a4b6a8;
    border-radius: 8px;
    font-size: .875rem;
    font-weight: 750;
  }
  .filter-button:hover, .quiet-button:hover { background: #eef1e6; }
  .filter-button:disabled, .quiet-button:disabled { opacity: .6; }
  .filter-icon {
    display: inline-block;
    width: 15px;
    height: 12px;
    background: linear-gradient(currentColor 0 0) top left / 15px 1.5px,
      linear-gradient(currentColor 0 0) center left / 11px 1.5px,
      linear-gradient(currentColor 0 0) bottom left / 7px 1.5px;
    background-repeat: no-repeat;
  }
  footer { color: var(--muted); padding: 16px 0 20px; font-size: .8125rem; }

  .attractions {
    grid-column: 1 / -1;
    padding: 20px 0 0;
    border-top: 1px solid var(--line);
  }
  .attractions h2 { margin: 0 0 10px; font-size: 1.35rem; letter-spacing: -0.04em; }
  .attraction-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: clamp(20px, 5vw, 65px);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .attraction-list li { border-bottom: 1px solid var(--line); }
  .attraction-list a {
    display: grid;
    align-content: center;
    gap: 3px;
    min-height: 62px;
    padding: 8px 4px;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .attraction-list a:hover { background: #edf0e7; }
  .attraction-name { font-weight: 750; text-decoration: underline; text-underline-offset: .2em; }
  .attraction-topic { font-size: .875rem; color: var(--muted); }

  .minimum-setting {
    display: grid;
    gap: 5px;
    margin: 0 20px 13px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #eff2e9;
  }
  .minimum-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .minimum-line label { font-weight: 750; }
  .minimum-value { display: flex; align-items: center; gap: 6px; }
  .minimum-value input {
    width: 76px;
    min-height: 44px;
    border: 1px solid #a4b6a8;
    border-radius: 7px;
    background: #fffefa;
    color: var(--ink);
    padding: 7px;
  }
  .minimum-note { margin: 0; color: var(--muted); font-size: .875rem; line-height: 1.4; }
  #minimum-error { color: var(--red); }

  dialog {
    width: min(500px, calc(100% - 24px));
    max-height: min(680px, calc(100dvh - 24px));
    padding: 0;
    overflow: hidden;
    border: 1px solid #9bafa2;
    border-radius: 14px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 16px 64px #10251d40;
  }
  dialog::backdrop { background: #152a2370; }
  .dialog-body {
    display: grid;
    grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
    max-height: min(678px, calc(100dvh - 26px));
  }
  .dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 16px 20px 8px;
  }
  .dialog-header h2 { margin: 0; font-size: 1.4rem; letter-spacing: -0.04em; }
  .close {
    min-width: 42px;
    min-height: 42px;
    font-size: 1.65rem;
    line-height: 1;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
  }
  .close:hover { background: #edf0e7; }
  .search {
    width: calc(100% - 40px);
    margin: 0 20px;
    padding: 12px;
    border: 1px solid #a4b6a8;
    border-radius: 8px;
    background: #fffefa;
    color: var(--ink);
    font-size: 1rem;
  }
  .dialog-tools {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 3px 8px;
    padding: 8px 20px;
    font-size: .875rem;
  }
  .only-excluded { display: flex; gap: 7px; align-items: center; min-height: 40px; cursor: pointer; }
  input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: #205443; flex: none; }
  .regions { overflow: auto; min-height: 0; margin: 0 20px; border-top: 1px solid var(--line); }
  .region-row {
    display: flex;
    align-items: center;
    gap: 11px;
    min-height: 43px;
    padding: 7px 9px;
    border-bottom: 1px solid #e0e4d7;
    cursor: pointer;
  }
  .region-row:focus-within { background: #eff2e9; }
  .region-area { margin-left: auto; font-size: .875rem; color: var(--muted); }
  .empty { padding: 6px 9px; color: var(--muted); }
  .done-bar { padding: 11px 20px 16px; }
  .done {
    min-height: 44px;
    width: 100%;
    border: 0;
    border-radius: 8px;
    color: white;
    background: #205443;
    font-weight: 750;
  }
  .done:hover { background: #174737; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 760px) {
    .page { padding: 0 16px; max-width: 560px; }
    .masthead { padding: 14px 0 13px; }
    .game { grid-template-columns: 1fr; gap: 12px; margin-top: 13px; }
    .map-frame { border-radius: 9px; }
    .map-caption { top: 12px; left: 13px; font-size: .8125rem; }
    .compass { right: 12px; bottom: 12px; }
    .compass::after { height: 24px; width: 14px; }
    .controls { padding: 3px 2px 0; }
    h1 { font-size: clamp(2.15rem, 8vw, 3.35rem); }
    h1 .title-break { display: none; }
    h1.is-result { font-size: clamp(2.1rem, 7vw, 3.25rem); }
    .province { margin-bottom: 4px; font-size: 1rem; }
    .description { margin-top: 6px; font-size: 1rem; }
    .draw-area { max-width: none; margin-top: 13px; }
    .draw { min-height: 52px; }
    .filters { max-width: none; margin-top: 13px; padding-top: 6px; }
    .attractions { margin-top: 8px; padding-top: 15px; }
    .attraction-list { grid-template-columns: 1fr; }
    footer { padding-top: 10px; }
  }

  @media (max-height: 520px) {
    dialog { overflow-y: auto; }
    .dialog-body { max-height: none; }
    .regions { min-height: 88px; max-height: 180px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .draw:active:not(:disabled) { transform: none; }
  }
</style>
</head>

<div class="page">
  <header class="masthead"><span class="target-icon" aria-hidden="true"></span> 여행 다트</header>
  <main class="game">
    <figure class="map-frame">
      <figcaption class="map-caption" aria-hidden="true">대한민국</figcaption>
      <svg id="map" viewBox="0 0 600 570" role="img" aria-label="대한민국 여행 다트 지도">
        <g id="regions"></g>
        <g class="water-label" aria-hidden="true">
          <text x="104" y="293">서해</text><text x="498" y="254">동해</text><text x="341" y="513">남해</text>
        </g>
        <path id="hit-region" fill-rule="evenodd" hidden></path>
        <circle id="impact" r="13" fill="none" stroke="#a83f2d" stroke-width="2" hidden></circle>
        <g id="dart" hidden>
          <g stroke-linejoin="round">
            <path d="M0 0 13 0" stroke="#242c25" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M11 -3 39 -3 39 3 11 3 8 0Z" fill="#edd8a1" stroke="#63482d" stroke-width="1.2"/>
            <path d="M19 -3v6m5 -6v6m5 -6v6" stroke="#886743" stroke-width="1.1"/>
            <path d="M34 0 47 -10 61 -7 56 0 61 7 47 10Z" fill="#bf4d33" stroke="#76311f" stroke-width="1.25"/>
            <path d="M35 0h21" stroke="#f1a084" stroke-width="1.4"/>
          </g>
        </g>
      </svg>
      <div class="compass" aria-hidden="true">N</div>
    </figure>
    <section class="controls" aria-labelledby="heading">
      <div aria-live="polite" aria-atomic="true">
        <p class="province" id="province" hidden></p>
        <h1 id="heading">어디로 <br class="title-break">떠나볼까?</h1>
      </div>
      <p class="description" id="description">자연·생태 명소가 있는 지역을 뽑아요.</p>
      <div class="draw-area">
        <button class="draw" id="draw" type="button"><span class="target-icon" aria-hidden="true"></span><span id="draw-text">다트 던지기</span></button>
        <button class="skip" id="skip" type="button" hidden>이 지역 빼고 다시 던지기</button>
      </div>
      <div class="filters">
        <p class="count" id="count" aria-live="polite"></p>
        <button class="filter-button" id="open-filters" type="button"><span class="filter-icon" aria-hidden="true"></span> <span id="filter-text">추첨 설정</span></button>
      </div>
    </section>
    <section class="attractions" id="attractions" aria-labelledby="attractions-heading" hidden>
      <h2 id="attractions-heading">지역 명소</h2>
      <ul class="attraction-list" id="attraction-list"></ul>
    </section>
  </main>
  <footer>지도 출처 <a href="https://www.data.go.kr/data/15129688/fileData.do" target="_blank" rel="noopener noreferrer">국가데이터처 SGIS</a> · 2025년 2분기 경계
    <br>명소 출처 <a href="https://spot100x100.kr/" target="_blank" rel="noopener noreferrer">한국관광공사 대한민국 명소발굴 100×100</a>
  </footer>
</div>

<dialog id="filters-dialog" aria-labelledby="filter-heading">
  <div class="dialog-body">
    <div class="dialog-header">
      <h2 id="filter-heading" tabindex="-1">추첨 설정</h2>
      <button class="close" type="button" aria-label="닫기">×</button>
    </div>
    <div class="minimum-setting">
      <div class="minimum-line">
        <label for="minimum-attractions">지역별 최소 명소 수</label>
        <div class="minimum-value">
          <input id="minimum-attractions" type="number" min="1" step="1" inputmode="numeric" aria-describedby="settings-count minimum-error">
          <span aria-hidden="true">곳</span>
        </div>
      </div>
      <p class="minimum-note" id="settings-count" aria-live="polite"></p>
      <p class="minimum-note" id="minimum-error" aria-live="polite" hidden>1 이상의 정수를 입력해 주세요.</p>
    </div>
    <label class="sr-only" for="search">지역 이름 검색</label>
    <input class="search" id="search" type="search" placeholder="빼고 싶은 지역 검색" autocomplete="off">
    <div class="dialog-tools">
      <label class="only-excluded"><input id="only-excluded" type="checkbox"> 제외한 곳만 보기</label>
      <button class="quiet-button" id="clear-exclusions" type="button">제외 전체 해제</button>
    </div>
    <div class="regions" id="region-list"></div>
    <form class="done-bar" method="dialog"><button class="done" id="done" type="submit">완료</button></form>
  </div>
</dialog>

<script>
  const regions = JSON.parse(document.getElementById('region-data').textContent);
  const byId = new Map(regions.map(region => [region.id, region]));
  const storageKey = 'korea-travel-dart.excluded.v1';
  const minimumKey = 'korea-travel-dart.minimum-attractions.v1';
  const drawDefaults = Object.freeze({ minimumAttractions: 3 });
  const { topics, byRegion } = JSON.parse(document.getElementById('attraction-data').textContent);
  const excluded = loadExclusions();
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const svgNS = 'http://www.w3.org/2000/svg';
  const colors = ['#c3d3b9', '#d4ddbc', '#c1d6c5', '#cddabc', '#bfd2bb'];
  const fillByArea = new Map([
    ['서울', 3], ['인천', 0], ['경기', 2], ['강원', 0],
    ['대전', 2], ['세종', 0], ['충북', 1], ['충남', 3],
    ['광주', 2], ['전북', 2], ['전남', 1], ['경북', 4],
    ['대구', 1], ['울산', 3], ['부산', 0], ['경남', 2], ['제주', 3],
  ]);
  const el = id => document.getElementById(id);
  const map = el('map');
  const mapRegions = el('regions');
  const hitRegion = el('hit-region');
  const dart = el('dart');
  const impact = el('impact');
  const heading = el('heading');
  const province = el('province');
  const description = el('description');
  const drawButton = el('draw');
  const drawText = el('draw-text');
  const skipButton = el('skip');
  const openFilters = el('open-filters');
  const filterText = el('filter-text');
  const count = el('count');
  const dialog = el('filters-dialog');
  const search = el('search');
  const onlyExcluded = el('only-excluded');
  const regionList = el('region-list');
  const clearExclusions = el('clear-exclusions');
  const done = el('done');
  const minimumInput = el('minimum-attractions');
  const minimumError = el('minimum-error');
  const settingsCount = el('settings-count');
  const attractions = el('attractions');
  const attractionList = el('attraction-list');
  const blankHeading = heading.innerHTML;
  const normalize = value => value.normalize('NFC').replace(/\s/g, '');
  const regionPaths = new Map();
  let selected = null;
  let throwing = false;
  let minimumAttractions = loadMinimum();

  function isValidMinimum(value) {
    return Number.isSafeInteger(value) && value >= 1;
  }

  function loadMinimum() {
    try {
      const saved = Number(localStorage.getItem(minimumKey));
      if (isValidMinimum(saved)) return saved;
    } catch {
      // Fall back to the default when browser storage is unavailable.
    }
    return drawDefaults.minimumAttractions;
  }

  function attractionCount(regionId) {
    return byRegion[regionId]?.length ?? 0;
  }

  function availableRegions() {
    return regions.filter(region => !excluded.has(region.id) && attractionCount(region.id) >= minimumAttractions);
  }

  for (const region of regions) {
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('class', 'region');
    path.setAttribute('d', region.path);
    path.setAttribute('fill', colors[fillByArea.get(region.area)]);
    path.setAttribute('fill-rule', 'evenodd');
    mapRegions.append(path);
    regionPaths.set(region.id, path);
    region.searchNames = [region.area + region.name, region.fullArea + region.name, region.fullArea].map(normalize);
  }

  function loadExclusions() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
      return new Set(Array.isArray(saved) ? saved.filter(id => byId.has(id)) : []);
    } catch {
      return new Set();
    }
  }

  function saveExclusions() {
    try {
      localStorage.setItem(storageKey, JSON.stringify([...excluded]));
    } catch {
      // Keep the settings for this visit when browser storage is unavailable.
    }
  }

  function updateControls() {
    const availableCount = availableRegions().length;
    drawButton.disabled = throwing || availableCount === 0;
    openFilters.disabled = throwing;
    skipButton.hidden = !selected || throwing;
    skipButton.textContent = availableCount === 1 ? '이 지역 빼기' : '이 지역 빼고 다시 던지기';
    drawText.textContent = throwing ? '다트가 날아가는 중' : selected ? '다시 던지기' : '다트 던지기';
    count.textContent = availableCount ? `추첨 가능 ${availableCount}곳` : '추첨할 지역이 없어요.';
    settingsCount.textContent = count.textContent;
    filterText.textContent = excluded.size ? `추첨 설정 · ${excluded.size}곳 제외` : '추첨 설정';
    clearExclusions.disabled = excluded.size === 0;
    done.textContent = excluded.size ? `완료 · ${excluded.size}곳 제외` : '완료';
    for (const [id, path] of regionPaths) {
      path.classList.toggle('is-unavailable', attractionCount(id) < minimumAttractions);
      path.classList.toggle('is-excluded', excluded.has(id));
    }
    if (selected) description.textContent = `자연·생태 명소 ${attractionCount(selected.id)}곳`;
    else if (!availableCount) description.textContent = '추첨 설정에서 최소 명소 수를 낮추거나 제외를 해제해 주세요.';
    else description.textContent = '자연·생태 명소가 있는 지역을 뽑아요.';
  }

  function clearResult() {
    selected = null;
    if (heading.classList.contains('is-result')) {
      heading.innerHTML = blankHeading;
      heading.classList.remove('is-result');
    }
    province.hidden = true;
    attractions.hidden = true;
    attractionList.replaceChildren();
    hitRegion.setAttribute('hidden', '');
    dart.setAttribute('hidden', '');
    impact.setAttribute('hidden', '');
    map.setAttribute('aria-label', '대한민국 여행 다트 지도');
  }

  function showResult(region) {
    selected = region;
    province.textContent = region.area;
    province.hidden = region.area === region.name;
    heading.textContent = region.name;
    heading.classList.add('is-result');
    hitRegion.setAttribute('d', region.path);
    hitRegion.removeAttribute('hidden');
    map.setAttribute('aria-label', `대한민국 여행 다트 지도 · ${region.area === region.name ? region.name : region.area + ' ' + region.name}`);

    const fragment = document.createDocumentFragment();
    for (const [name, topicId, rank, sourceIndex, detailUrl] of byRegion[region.id]) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = detailUrl ?? `https://spot100x100.kr/map/#p=${sourceIndex}`;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      const title = document.createElement('span');
      title.className = 'attraction-name';
      title.textContent = name;
      const ranking = document.createElement('span');
      ranking.className = 'attraction-topic';
      ranking.textContent = `${topics[topicId]} · ${rank}위`;
      link.append(title, ranking);
      item.append(link);
      fragment.append(item);
    }
    attractionList.replaceChildren(fragment);
    attractions.hidden = false;
  }

  async function throwDart() {
    if (throwing) return;
    const candidates = availableRegions();
    if (!candidates.length) return;

    const target = candidates[Math.floor(Math.random() * candidates.length)];
    const [x, y] = target.point;
    const drawWasFocused = document.activeElement === drawButton;
    clearResult();
    throwing = true;
    updateControls();

    const endAngle = Math.atan2(610 - y, 620 - x) * 180 / Math.PI;
    const landing = `translate(${x}px, ${y}px) rotate(${endAngle}deg)`;
    dart.style.transform = landing;
    dart.removeAttribute('hidden');

    if (!reducedMotion.matches) {
      const flight = dart.animate([
        { transform: 'translate(620px, 610px) rotate(46deg) scale(2.9)' },
        { transform: `translate(${x + (620 - x) * .33}px, ${y + (610 - y) * .33 - 12}px) rotate(${endAngle}deg) scale(1.65)`, offset: .65 },
        { transform: landing },
      ], { duration: 690, easing: 'cubic-bezier(.35,.04,.63,1)' });
      await flight.finished.catch(() => {});

      impact.setAttribute('cx', x);
      impact.setAttribute('cy', y);
      impact.removeAttribute('hidden');
      const ring = impact.animate([
        { opacity: .8, transform: 'scale(.25)' },
        { opacity: 0, transform: 'scale(1.7)' },
      ], { duration: 400, easing: 'ease-out', fill: 'forwards' });
      await ring.finished.catch(() => {});
      impact.setAttribute('hidden', '');
      ring.cancel();
    }

    showResult(target);
    throwing = false;
    updateControls();
    if (drawWasFocused && document.activeElement === document.body) drawButton.focus({ preventScroll: true });
  }

  function renderList() {
    const query = normalize(search.value);
    const visible = regions.filter(region =>
      (!onlyExcluded.checked || excluded.has(region.id)) &&
      (!query || region.searchNames.some(name => name.includes(query)))
    );
    if (!visible.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = query ? '검색 결과가 없어요.' : '제외한 곳이 없어요.';
      regionList.replaceChildren(empty);
      return;
    }

    const fragment = document.createDocumentFragment();
    for (const region of visible) {
      const row = document.createElement('label');
      row.className = 'region-row';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = region.id;
      checkbox.checked = excluded.has(region.id);
      const name = document.createElement('span');
      name.textContent = region.name;
      row.append(checkbox, name);
      if (region.area !== region.name) {
        const area = document.createElement('span');
        area.className = 'region-area';
        area.textContent = region.area;
        row.append(area);
      }
      fragment.append(row);
    }
    regionList.replaceChildren(fragment);
  }

  drawButton.addEventListener('click', throwDart);
  skipButton.addEventListener('click', () => {
    if (!selected || throwing) return;
    excluded.add(selected.id);
    saveExclusions();
    clearResult();
    updateControls();
    (drawButton.disabled ? openFilters : drawButton).focus({ preventScroll: true });
    throwDart();
  });

  openFilters.addEventListener('click', () => {
    minimumInput.value = minimumAttractions;
    minimumError.hidden = true;
    minimumInput.removeAttribute('aria-invalid');
    search.value = '';
    onlyExcluded.checked = false;
    renderList();
    dialog.showModal();
    el('filter-heading').focus();
    regionList.scrollTop = 0;
  });
  dialog.querySelector('.close').addEventListener('click', () => dialog.close());
  minimumInput.addEventListener('input', () => {
    const value = minimumInput.valueAsNumber;
    const valid = minimumInput.validity.valid && isValidMinimum(value);
    minimumError.hidden = valid;
    if (!valid) {
      minimumInput.setAttribute('aria-invalid', 'true');
      return;
    }

    minimumInput.removeAttribute('aria-invalid');
    minimumAttractions = value;
    try {
      localStorage.setItem(minimumKey, String(value));
    } catch {
      // Keep the new setting for this visit when browser storage is unavailable.
    }
    if (selected && attractionCount(selected.id) < value) clearResult();
    updateControls();
  });
  search.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !event.isComposing) {
      event.preventDefault();
      dialog.close();
    }
  });
  search.addEventListener('input', () => {
    renderList();
    regionList.scrollTop = 0;
  });
  onlyExcluded.addEventListener('change', () => {
    renderList();
    regionList.scrollTop = 0;
  });
  regionList.addEventListener('change', event => {
    const checkbox = event.target;
    if (checkbox.checked) excluded.add(checkbox.value);
    else excluded.delete(checkbox.value);
    if (selected && excluded.has(selected.id)) clearResult();
    saveExclusions();
    updateControls();
    if (onlyExcluded.checked) {
      renderList();
      (regionList.querySelector('input') || onlyExcluded).focus();
    }
  });
  clearExclusions.addEventListener('click', () => {
    excluded.clear();
    saveExclusions();
    updateControls();
    renderList();
    search.focus();
  });
  updateControls();
</script>
